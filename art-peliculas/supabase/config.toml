# Configuração do Supabase CLI para desenvolvimento local (`supabase start`).
# Em produção, replique as opções de Auth no painel do projeto (veja o README).
project_id = "art-peliculas"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
# Caixa de e-mails de teste (convites e recuperação de senha).
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://127.0.0.1:5173/**", "http://localhost:4173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Sistema interno: contas são criadas somente por convite do administrador.
enable_signup = false
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.rate_limit]
email_sent = 30

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
max_frequency = "10s"

[auth.email.template.invite]
subject = "Você foi convidado para o sistema Art Películas"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Redefinição de senha — Art Películas"
content_path = "./supabase/templates/recovery.html"

[functions.admin-users]
enabled = true
verify_jwt = true
